<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#e9eaec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Gezdiğin rotayı haritada çiz, yürüyüş ve ulaşım bölümlerini ayır, fotoğraflarla birlikte animasyon olarak oynat.">
<title>Rotam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: harita her zaman tam ekran; üstünde yüzen buzlu-cam paneller.
   Masaüstü: solda yüzen panel. Telefon: kenarlardan boşluklu, sürüklenebilir alt panel.
   Renk: tek renkli (mürekkep) arayüz, ulaşım şekilleri için soluk tonlar. Tipografi: geniş ve kalın Archivo başlıklar. */
:root{
  --map-bg:#e9eaec;
  --ink:#14161a; --ink-2:#4b5059; --ink-3:#80858e; --on-ink:#ffffff;
  --glass:rgba(250,250,252,.56); --glass-strong:rgba(252,252,253,.84); --glass-line:rgba(255,255,255,.72);
  --hair:rgba(20,22,26,.09); --fill:rgba(20,22,26,.05); --fill-2:rgba(20,22,26,.09);
  --danger:#c23b2a; --halo:rgba(255,255,255,.92);
  --shadow:0 22px 60px rgb(15 18 25 / .16), 0 2px 8px rgb(15 18 25 / .07);
  --blur:saturate(1.7) blur(24px);
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --panel-w:400px; --vis-left:432px; --sheet-h:0px;
  --sat:env(safe-area-inset-top, 0px); --sab:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --map-bg:#15171b; --ink:#f1f2f4; --ink-2:#b4b8c0; --ink-3:#848993; --on-ink:#14161a;
  --glass:rgba(24,26,31,.52); --glass-strong:rgba(30,32,38,.86); --glass-line:rgba(255,255,255,.10);
  --hair:rgba(255,255,255,.08); --fill:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.11);
  --danger:#ff6b57; --halo:rgba(14,16,20,.85); --shadow:0 22px 60px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --map-bg:#15171b; --ink:#f1f2f4; --ink-2:#b4b8c0; --ink-3:#848993; --on-ink:#14161a;
  --glass:rgba(24,26,31,.52); --glass-strong:rgba(30,32,38,.86); --glass-line:rgba(255,255,255,.10);
  --hair:rgba(255,255,255,.08); --fill:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.11);
  --danger:#ff6b57; --halo:rgba(14,16,20,.85); --shadow:0 22px 60px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--map-bg);color:var(--ink);font:400 14px/1.45 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* Buzlu cam */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--glass-strong);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ---------- Harita sahnesi ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--map-bg)}
#frame{position:relative;width:100%;height:100%;overflow:hidden}
#map{position:absolute;inset:0;background:var(--map-bg)}
.leaflet-container{font-family:var(--body);background:var(--map-bg)}
#map[data-look="sade"] .leaflet-tile-pane{filter:grayscale(1) contrast(.92) brightness(1.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #map[data-look="sade"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(1) brightness(.78) contrast(.92)}
  :root:not([data-theme="light"]) #map[data-look="sat"] .leaflet-tile-pane{filter:brightness(.8)}}
:root[data-theme="dark"] #map[data-look="sade"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(1) brightness(.78) contrast(.92)}
:root[data-theme="dark"] #map[data-look="sat"] .leaflet-tile-pane{filter:brightness(.8)}
.leaflet-top{top:var(--sat)}
.leaflet-top.leaflet-right{right:4px}
.leaflet-control-attribution{background:var(--glass)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink-3)!important;border-radius:8px 0 0 0;font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-control-zoom{border:0!important;border-radius:14px!important;overflow:hidden}
.leaflet-control-zoom a{background:transparent!important;color:var(--ink)!important;border:0!important;width:38px!important;height:38px!important;line-height:36px!important;font-weight:500!important}
.leaflet-control-zoom a:first-child{border-bottom:1px solid var(--hair)!important}
.mapctl{border-radius:14px;overflow:hidden}
.mapctl select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);padding:9px 30px 9px 12px;font:600 12.5px var(--body);cursor:pointer}
.mapctl{position:relative}
.mapctl::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.legend{border-radius:14px;padding:9px 12px;display:grid;gap:6px;font:600 11.5px var(--body);color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:9px}
.legend i{width:22px;height:4px;border-radius:2px;background:var(--c)}
.legend i.d{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 8px)}

/* ---------- Panel ---------- */
#panel{position:fixed;top:16px;left:16px;bottom:16px;width:var(--panel-w);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;z-index:1000}
.grab{display:none}
.head{padding:20px 22px 16px;display:grid;gap:14px;border-bottom:1px solid var(--hair)}
.toprow{display:flex;align-items:center;gap:6px}
.wordmark{font:800 13px/1 var(--display);font-stretch:125%;letter-spacing:.02em;margin-right:6px}
.pill-sel{position:relative;flex:1;min-width:0}
.pill-sel select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:var(--fill);border-radius:999px;padding:7px 30px 7px 12px;font:600 12.5px var(--body);text-overflow:ellipsis;cursor:pointer}
.pill-sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.icb{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none;position:relative}
.icb:hover{background:var(--fill-2);color:var(--ink)}
.icb svg{width:18px;height:18px}
.icb.danger:hover,.icb.armed{background:var(--danger);color:#fff}
#tripTitle{font:850 30px/1.04 var(--display);font-stretch:125%;letter-spacing:-.015em;border:0;background:none;padding:0;width:100%;text-wrap:balance}
#tripTitle::placeholder{color:var(--ink-3)}
#tripTitle:focus{outline:none;box-shadow:0 2px 0 var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stat{display:grid;gap:3px;min-width:0}
.stat b{font:600 21px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font:600 9.5px/1.15 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

.find{padding:12px 22px;display:grid;gap:8px;border-bottom:1px solid var(--hair)}
.search{position:relative}
.search input{width:100%;border:0;background:var(--fill);border-radius:14px;padding:11px 14px 11px 40px;font-weight:500;-webkit-appearance:none}
.search input:focus{outline:none;background:var(--fill-2)}
.search svg{position:absolute;left:14px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--ink-3)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);border-radius:16px;z-index:1200;max-height:min(330px,46vh);overflow:auto;background:var(--glass-strong)}
#results button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;border-bottom:1px solid var(--hair);font-weight:600}
#results button:last-child{border-bottom:0}
#results button:hover,#results button:focus{background:var(--fill-2);outline:none}
#results small{display:block;color:var(--ink-3);font-size:12px;font-weight:400;margin-top:1px}
.hint{font-size:12px;color:var(--ink-3);margin:0;line-height:1.4}
.hint b{color:var(--ink-2);font-weight:600}

#list{flex:1;overflow:auto;padding:14px 22px 26px;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.station{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start}
.node{position:relative;height:100%;min-height:44px}
.node::before{content:"";position:absolute;left:5px;top:13px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--map-bg);box-sizing:border-box;z-index:1}
.station.end .node::before{background:var(--ink)}
.node::after{content:"";position:absolute;left:10px;top:25px;bottom:-2px;width:2px;background:var(--segc,transparent)}
.station.dashed .node::after{background:repeating-linear-gradient(to bottom,var(--segc) 0 3px,transparent 3px 7px)}
.st-body{min-width:0;padding-top:4px}
.st-top{display:flex;align-items:baseline;gap:8px}
.no{font:600 11px var(--mono);color:var(--ink-3);flex:none}
.st-name{flex:1;min-width:0;border:0;background:none;padding:0;font:750 17px/1.25 var(--display);font-stretch:108%;letter-spacing:-.01em;text-overflow:ellipsis}
.st-note{display:block;width:100%;border:0;background:none;padding:1px 0 0 27px;font-size:12.5px;color:var(--ink-2)}
.st-note::placeholder{color:var(--ink-3);opacity:.8}
.st-name:focus,.st-note:focus{outline:none;box-shadow:0 1.5px 0 var(--ink)}
.tools{display:flex;gap:0;padding-top:2px}
.tools .icb{width:32px;height:32px}
.tools .icb svg{width:16px;height:16px}
.cnt{position:absolute;top:2px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--ink);color:var(--on-ink);font:600 9px/15px var(--mono);text-align:center;padding:0 3px}
.more{display:none}
.media-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px 27px;scrollbar-width:none}
.media-strip::-webkit-scrollbar{display:none}
.thumb{position:relative;flex:none;width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--fill-2)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgb(0 0 0 / .55);color:#fff;display:grid;place-items:center;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.thumb .x svg{width:11px;height:11px}
.thumb .vid{position:absolute;left:4px;bottom:4px;width:16px;height:16px;border-radius:50%;background:rgb(0 0 0 / .55);display:grid;place-items:center;color:#fff}
.thumb .vid svg{width:8px;height:8px}
.addmedia{flex:none;width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--ink-3);display:grid;place-items:center;color:var(--ink-3);cursor:pointer}
.addmedia:hover{border-color:var(--ink);color:var(--ink)}
.addmedia svg{width:20px;height:20px}

.seg{display:grid;grid-template-columns:22px 1fr;gap:12px}
.seg .rail{position:relative}
.seg .rail::before{content:"";position:absolute;left:10px;top:-2px;bottom:-2px;width:2px;background:var(--segc)}
.seg.dashed .rail::before{background:repeating-linear-gradient(to bottom,var(--segc) 0 3px,transparent 3px 7px)}
.seg-body{padding:8px 10px 10px;margin:4px 0 6px -10px;border-radius:16px;display:grid;gap:8px;min-width:0}
.seg.active .seg-body{background:var(--fill-2)}
.seg-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.mode{position:relative;display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:999px;padding:0 10px 0 9px;height:32px;color:var(--ink)}
.mode .ic{width:20px;height:20px;flex:none}
.mode .ic svg{width:20px;height:20px}
.mode select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:600 12.5px var(--body);padding:0 14px 0 0;cursor:pointer;height:100%}
.mode::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.mode .sw{width:8px;height:8px;border-radius:50%;background:var(--segc);flex:none}
.meta{font:400 11.5px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbtn{border:1px solid var(--hair);background:transparent;border-radius:999px;height:30px;padding:0 12px;font:600 12px var(--body);color:var(--ink-2);white-space:nowrap;flex:none}
.pbtn:hover{border-color:var(--ink);color:var(--ink)}
.seg.active .pbtn.edit{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.edit-help{font-size:12.5px;color:var(--ink-2);display:grid;gap:8px}
.edit-help label{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.edit-help .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.warn{color:var(--danger);font-size:12px;font-weight:600}
/* Gizli adımlar: varsayılan olarak tek ince satıra katlanır */
.ggroup,.ghead{display:grid;grid-template-columns:22px 1fr;gap:12px}
.ggroup .rail,.ghead .rail{position:relative}
.ggroup .rail::before,.ghead .rail::before{content:"";position:absolute;left:10px;top:-2px;bottom:-2px;width:2px;background:repeating-linear-gradient(to bottom,var(--ink-3) 0 2px,transparent 2px 6px);opacity:.45}
.ggroup.route .rail::before{background:var(--segc);opacity:1}
.ggroup.route.dashed .rail::before{background:repeating-linear-gradient(to bottom,var(--segc) 0 3px,transparent 3px 7px)}
/* Sürükle-bırak */
#list{position:relative}
.grip{border:0;background:transparent;width:20px;height:26px;margin:-3px 0 0 -8px;padding:0;color:var(--ink-3);cursor:grab;touch-action:none;display:grid;place-items:center;opacity:.5;flex:none;align-self:center}
.grip:hover,.grip:focus-visible{opacity:1;color:var(--ink)}
.grip svg{width:10px;height:16px}
.node{cursor:grab;touch-action:none}
.station .no,.station .node,.grip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.station{-webkit-touch-callout:none}
.dragfloat{position:fixed;z-index:3000;pointer-events:none;border-radius:18px;padding:4px 12px 0;background:var(--glass-strong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-line);box-shadow:0 26px 60px rgb(0 0 0 / .32);transform:scale(1.025) rotate(-.6deg);transform-origin:30% 50%;animation:lift .18s ease-out}
.dragfloat .tools,.dragfloat .media-strip{visibility:hidden}
@keyframes lift{from{transform:scale(1) rotate(0)}}
/* Bırakılacak yerin canlı önizlemesi: diğer duraklar kayarak yer açar, boşlukta soluk bir silüet durur */
.slot{position:relative;margin:2px 0 4px -10px;padding-left:10px;border-radius:18px;border:1.5px dashed color-mix(in srgb,var(--ink) 38%,transparent);background:var(--fill);overflow:hidden;box-sizing:border-box;animation:slotIn .2s ease-out}
.slot-in{opacity:.42;filter:grayscale(1);pointer-events:none}
.slot-in .tools,.slot-in .media-strip{visibility:hidden}
.slot-in .no{opacity:1}
@keyframes slotIn{from{opacity:0;transform:scaleY(.92)}}
body.dragging-list,body.dragging-list *{cursor:grabbing!important}
body.dragging-list{-webkit-user-select:none;user-select:none}
@keyframes settle{0%{background:var(--fill-2)}100%{background:transparent}}
.station.moved{animation:settle 1.4s ease-out;border-radius:14px}
.gwrap{margin:4px 0 8px -10px;padding:0 0 4px 10px;border-radius:18px;background:var(--fill)}
.gwrap .ghead .rail::before{top:10px}
.gwrap .gbtn{margin-top:4px}
.seg.ghost .mode{height:28px}
.seg.ghost .pbtn{height:26px}
.gbtn{display:flex;align-items:center;gap:7px;width:calc(100% + 10px);min-width:0;margin:2px 0 2px -10px;padding:6px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink-3);font:600 11.5px var(--body);text-align:left;white-space:nowrap}
.gbtn:hover{background:var(--fill);color:var(--ink-2)}
.gbtn>svg{width:14px;height:14px;flex:none;opacity:.8}
.gbtn .gm{display:flex;gap:1px;flex:none}
.gbtn .gm svg{width:14px;height:14px}
.gbtn .gs{font-weight:400;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gbtn .chev{margin-left:auto;flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.gbtn[aria-expanded="true"] .chev{transform:translateY(1px) rotate(-135deg)}
.station.ghost .node{min-height:34px}
.station.ghost .node::before{top:10px;left:6px;width:10px;height:10px;border-style:dashed;border-color:var(--ink-3);background:transparent}
.station.ghost .st-body{opacity:.6;padding-top:3px}
.station.ghost .st-name{font-size:14px;font-weight:600;font-style:italic;font-stretch:100%}
.station.ghost .st-note{display:none}
.station.ghost .tools .icb{width:28px;height:28px;opacity:.7}
.station.ghost .tools .icb.eye{opacity:1}
.station.ghost .tools .icb svg{width:15px;height:15px}
.seg.ghost .seg-body{opacity:.55;padding-top:4px;padding-bottom:6px}
.seg.ghost .rail::before{opacity:.35}
.icb.eye[aria-pressed="false"]{color:var(--ink-3)}
.toast button{margin-left:10px;border:0;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:4px 11px;font:600 12px var(--body)}
.empty{padding:24px 0;display:grid;gap:8px}
.empty h3{margin:0;font:800 22px var(--display);font-stretch:118%}

.foot{border-top:1px solid var(--hair);padding:12px 22px calc(12px + var(--sab));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.foot::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--hair);background:transparent;border-radius:999px;height:32px;padding:0 13px;font:600 12px var(--body);white-space:nowrap;display:flex;align-items:center;flex:none;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* ---------- Üst katmanlar ---------- */
.caption{position:absolute;left:calc(var(--vis-left) + 16px);top:calc(var(--sat) + 16px);z-index:900;border-radius:20px;padding:12px 16px 13px;max-width:min(380px,calc(100% - var(--vis-left) - 120px));transition:opacity .3s}
.caption .k{display:flex;align-items:center;gap:7px;font:600 10.5px/1 var(--body);text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3)}
.caption .k i{width:8px;height:8px;border-radius:50%;background:var(--capc,var(--ink))}
.caption .v{font:850 23px/1.06 var(--display);font-stretch:118%;letter-spacing:-.015em;margin-top:6px;text-wrap:balance}
.caption .s{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.banner{position:absolute;left:calc(var(--vis-left) + (100% - var(--vis-left)) / 2);top:calc(var(--sat) + 16px);transform:translateX(-50%);z-index:950;border-radius:999px;padding:9px 16px;font:600 12.5px var(--body);max-width:calc(100% - var(--vis-left) - 32px);text-align:center;background:var(--ink);color:var(--on-ink);box-shadow:var(--shadow)}
.toast{position:absolute;left:calc(var(--vis-left) + (100% - var(--vis-left)) / 2);bottom:calc(var(--player-b) + 72px);transform:translateX(-50%);z-index:1300;border-radius:999px;padding:9px 16px;font:600 13px var(--body);max-width:calc(100% - var(--vis-left) - 32px);text-align:center}
:root{--player-b:calc(20px + var(--sab))}

.player{position:absolute;left:calc(var(--vis-left) + (100% - var(--vis-left)) / 2);bottom:var(--player-b);transform:translateX(-50%);z-index:960;display:flex;align-items:center;gap:6px;border-radius:24px;padding:7px;width:min(580px,calc(100% - var(--vis-left) - 32px));transition:opacity .3s}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.play:active{transform:scale(.94)}
.play svg{width:18px;height:18px}
.track{flex:1;min-width:30px;display:grid;gap:6px;padding:0 6px}
.track .lbl{font:600 11.5px/1 var(--body);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--fill-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.pl{border:0;background:transparent;color:var(--ink-2);border-radius:999px;height:40px;padding:0 12px;display:flex;align-items:center;gap:7px;font:600 12px var(--body);white-space:nowrap;flex:none}
.pl svg{width:18px;height:18px;flex:none}
.pl:hover{background:var(--fill-2);color:var(--ink)}
.pl[aria-pressed="true"]{background:var(--fill-2);color:var(--ink)}
.pl[aria-pressed="false"] .on-ic{display:none}
.pl[aria-pressed="true"] .off-ic{display:none}
.pl.rec .dotrec{width:10px;height:10px;border-radius:50%;background:var(--danger)}
details.settings{position:relative;flex:none}
details.settings summary{list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings[open] summary{background:var(--fill-2);color:var(--ink)}
.popover{position:absolute;right:-7px;bottom:calc(100% + 14px);border-radius:22px;padding:16px 18px;display:grid;gap:12px;width:280px;font-size:13px;background:var(--glass-strong)}
.popover h4{margin:0 0 2px;font:800 16px var(--display);font-stretch:118%}
.popover label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;color:var(--ink-2)}
.popover input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--ink)}
.popover input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
.popover select{border:0;background:var(--fill);border-radius:999px;padding:5px 10px;font:600 12.5px var(--body)}
.popover .v{font:600 12px var(--mono);color:var(--ink)}

/* Medya sahnesi: arka perde + kart; bitince kart haritadaki baloncuğa küçülür */
.mediastage{position:absolute;inset:0;z-index:940;display:grid;place-items:center;pointer-events:none;visibility:hidden;transition:visibility 0s linear .5s}
.mediastage.on{visibility:visible;transition-delay:0s}
.mediastage.interactive{pointer-events:auto;cursor:pointer}
.scrim{position:absolute;inset:0;background:rgb(8 10 14 / .32);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);opacity:0;transition:opacity .45s ease}
.mediastage.on .scrim{opacity:1}
.mediastage.collapsing .scrim{opacity:0}
.mcard{position:relative;max-width:86%;max-height:82%;display:grid;grid-template-rows:minmax(0,1fr) auto;border-radius:24px;overflow:hidden;background:rgb(18 20 24 / .6);border:1px solid rgb(255 255 255 / .14);box-shadow:0 30px 80px rgb(0 0 0 / .45);opacity:0;transform:translateY(14px) scale(.97);transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .35s ease;transform-origin:center}
.mediastage.on .mcard{opacity:1;transform:none}
.mbox{min-height:0;display:grid;place-items:center;background:#000}
.mbox img,.mbox video{display:block;max-width:100%;max-height:calc(82vh - 64px);object-fit:contain}
body.present .mbox img,body.present .mbox video{max-height:68vh}
.mcap{display:flex;align-items:baseline;gap:10px;padding:11px 16px 13px;color:#fff}
.mcap .n{font:600 11px var(--mono);color:#ffffff99}
.mcap .t{font:800 19px/1.1 var(--display);font-stretch:115%;min-width:0}
.mcap .c{margin-left:auto;font:600 11px var(--mono);color:#ffffff80}

/* Harita işaretleri */
.pin{position:relative;width:24px;height:24px;border-radius:50%;background:var(--glass-strong);color:var(--ink);border:1.5px solid var(--ink);display:grid;place-items:center;font:600 9.5px var(--mono);box-shadow:0 3px 10px rgb(0 0 0 / .18)}
.pin.sel{background:var(--ink);color:var(--on-ink)}
.pin.media::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink);border:1.5px solid var(--map-bg)}
.via{width:14px;height:14px;transform:rotate(45deg);border-radius:3px;background:var(--ink);border:2px solid var(--map-bg);box-shadow:0 1px 5px rgb(0 0 0 / .3)}
.pin.ghost{background:transparent;border:1.5px dashed var(--ink-3);color:transparent;box-shadow:none;opacity:.75;width:18px;height:18px;margin:3px}
/* Medya baloncuğu */
.bub{position:relative;width:46px;height:46px;border-radius:15px;padding:3px;background:var(--glass-strong);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--glass-line);box-shadow:0 8px 22px rgb(0 0 0 / .22);cursor:pointer;animation:bubpop .6s cubic-bezier(.2,1.4,.4,1) both;transition:transform .2s}
.bub:hover{transform:scale(1.07)}
.bub::before,.bub::after{content:"";position:absolute;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 2px 6px rgb(0 0 0 / .15)}
.bub::before{width:8px;height:8px;left:-7px;top:-7px}
.bub::after{width:4px;height:4px;left:-12px;top:-12px}
.bub-in{width:100%;height:100%;border-radius:12px;overflow:hidden;background:var(--fill-2)}
.bub-in img,.bub-in video{width:100%;height:100%;object-fit:cover;display:block}
.bub-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--on-ink);font:600 10px/18px var(--mono);text-align:center;padding:0 4px}
.bub-play{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgb(0 0 0 / .5);display:grid;place-items:center;color:#fff}
.bub-play svg{width:8px;height:8px}
.bub.ghost{opacity:.45;animation:none}
.bub.quiet{animation:none}
@keyframes bubpop{from{transform:translate(-14px,-14px) scale(.2);opacity:0}}
.leaflet-tooltip.stoplabel{background:var(--glass-strong);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);border:1px solid var(--glass-line);border-radius:999px;padding:4px 11px 4px;font:700 12.5px var(--body);box-shadow:0 6px 18px rgb(0 0 0 / .16);white-space:nowrap}
.leaflet-tooltip.stoplabel::before{display:none}
.leaflet-tooltip.linelabel{background:var(--glass-strong);color:var(--ink);border:0;border-radius:10px;font:600 12px var(--body);box-shadow:0 4px 14px rgb(0 0 0 / .15)}
.leaflet-tooltip.linelabel::before{display:none}

/* Hareket eden araç */
.mv{position:relative;width:52px;height:52px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;--alt:0}
.mv-disc{position:absolute;inset:0;border-radius:50%;background:var(--glass-strong);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--glass-line);box-shadow:0 10px 26px rgb(0 0 0 / .26), inset 0 0 0 2px var(--mc);display:grid;place-items:center;color:var(--ink)}
.mv-orient{width:30px;height:30px;transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.mv-anim{width:30px;height:30px}
.mv-anim svg{width:30px;height:30px;overflow:visible}
.legB{opacity:0}
.mv.m-walk .mv-anim{animation:bob .26s ease-in-out infinite alternate}
.mv.m-walk .legA{animation:stepA .52s steps(1) infinite}
.mv.m-walk .legB{animation:stepB .52s steps(1) infinite}
.mv .wheel{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
.mv.m-bike .mv-anim{animation:bob .3s ease-in-out infinite alternate}
.mv.m-car .body,.mv.m-bus .body{animation:bounce .32s ease-in-out infinite alternate}
.mv.m-train .mv-anim{animation:rumble .14s linear infinite alternate}
.mv.m-boat .mv-anim{transform-origin:50% 80%;animation:rock 2.4s ease-in-out infinite}
.mv.m-gondola .mv-anim{transform-origin:50% 70%;animation:rock 3.2s ease-in-out infinite}
.mv.m-cable .mv-anim{transform-origin:50% 0;animation:sway 2.8s ease-in-out infinite}
.mv.m-plane .mv-disc{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.mv.m-plane .mv-orient{transition:none;width:36px;height:36px}
.mv.m-plane .mv-anim{width:36px;height:36px;transform:scale(calc(1 + var(--alt) * .45))}
.mv.m-plane .mv-anim svg{width:36px;height:36px;filter:drop-shadow(0 1px 1px rgb(0 0 0 / .25))}
.mv-shadow{display:none}
.mv.m-plane .mv-shadow{display:block;position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;transform:translate(calc(var(--alt) * 16px),calc(var(--alt) * 20px)) scale(calc(1 - var(--alt) * .25));filter:blur(calc(1px + var(--alt) * 3px));opacity:calc(.35 - var(--alt) * .15)}
.mv.m-plane .mv-shadow svg{width:30px;height:30px;color:#000}
.mv.idle *, .mv.idle{animation-play-state:paused!important}
.ripple{width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:1.5px solid var(--mc);animation:ripple 1.7s ease-out forwards}
.pulse{width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid var(--ink);animation:ripple 1.2s ease-out forwards}
@keyframes pop{from{transform:scale(.55);opacity:0}}
@keyframes bob{to{transform:translateY(-1.6px)}}
@keyframes stepA{0%{opacity:1}50%{opacity:0}}
@keyframes stepB{0%{opacity:0}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{to{transform:translateY(-.9px)}}
@keyframes rumble{to{transform:translate(.4px,-.3px)}}
@keyframes rock{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-1px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes ripple{from{transform:scale(.3);opacity:.75}to{transform:scale(1.7);opacity:0}}

/* ---------- Sunum / kayıt ---------- */
body.present{--vis-left:0px}
body.present #panel{display:none}
body.present #stage{background:#000}
body.present #frame.r916{width:auto;height:100%;aspect-ratio:9/16;max-width:100%}
body.present #frame.r169{width:100%;height:auto;aspect-ratio:16/9;max-height:100%}
body.present #frame.r45{width:auto;height:100%;aspect-ratio:4/5;max-width:100%}
body.present .leaflet-control-zoom,body.present .mapctl,body.present .legend,body.present .banner{display:none}
.exit-present{display:none}
body.present .exit-present{display:flex;position:absolute;right:14px;top:calc(var(--sat) + 14px);z-index:970}
body.playing.present .player,body.playing.present .exit-present{opacity:0;pointer-events:none}
body.recording .player,body.recording .exit-present{opacity:0!important;pointer-events:none}
.titlecard{display:none;position:absolute;left:16px;right:16px;bottom:calc(22px + var(--sab));z-index:930;pointer-events:none;text-align:center}
body.present .titlecard{display:block}
body.present:not(.playing) .titlecard{bottom:calc(var(--player-b) + 76px)}
.titlecard div{display:inline-block;font:900 clamp(22px,5.4vw,40px)/1.02 var(--display);font-stretch:125%;letter-spacing:-.02em;padding:12px 20px 13px;border-radius:22px;text-wrap:balance}
.recdot{display:none;position:absolute;right:16px;bottom:16px;z-index:980;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
body.recording .recdot{display:block}
@keyframes blink{50%{opacity:.2}}

/* ---------- Telefon ---------- */
@media (max-width:760px){
  :root{--vis-left:0px;--player-b:calc(var(--sheet-h) + var(--sab) + 18px)}
  #panel{top:auto;left:8px;right:8px;bottom:calc(8px + var(--sab));width:auto;height:var(--sheet-h);border-radius:28px;transition:height .32s cubic-bezier(.2,.9,.25,1)}
  #panel.dragging{transition:none}
  .grab{display:block;position:absolute;top:0;left:0;right:0;height:26px;z-index:5;border:0;background:transparent;touch-action:none}
  .grab::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.55;transform:translateX(-50%)}
  .head{padding:24px 18px 14px;gap:12px;touch-action:none;cursor:grab}
  #tripTitle{font-size:24px}
  .stat b{font-size:18px}
  .find{padding:10px 18px}
  #list{padding:12px 16px 24px}
  .foot{padding:10px 16px 12px}
  input,select,.search input,.st-note,.st-name{font-size:16px}
  .st-name{font-size:17px}
  .mode select,.pill-sel select,.popover select{font-size:16px}
  .icb{width:40px;height:40px}
  .tools .icb{width:38px;height:38px}
  .tools .icb.hide-sm{display:none}
  .more{display:grid}
  .station.open .tools{flex-wrap:wrap;justify-content:flex-end;max-width:118px}
  .station.open .tools .icb.hide-sm{display:grid}
  .player{width:calc(100% - 16px);padding:6px;gap:2px;border-radius:24px}
  .pl .t{display:none}
  .pl{padding:0 11px;height:42px}
  .play{width:44px;height:44px}
  .track{padding:0 8px}
  .popover{right:-6px;width:min(300px,calc(100vw - 28px))}
  .caption{left:12px;top:calc(var(--sat) + 12px);right:64px;max-width:none;padding:10px 14px 11px;border-radius:18px}
  .caption .v{font-size:19px}
  .banner{top:auto;bottom:calc(var(--player-b) + 70px);max-width:calc(100% - 24px)}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom{bottom:calc(var(--sheet-h) + var(--sab) + 8px)}
  .leaflet-control-attribution{border-radius:8px 0 0 8px}
  .legend{display:none}
  body.sheet-full .player,body.sheet-full .caption,body.sheet-full .banner{opacity:0;pointer-events:none}
  body.present{--player-b:calc(16px + var(--sab))}
  .mcard{max-width:94%}
}
@media (max-width:380px){
  .stat span{font-size:8.5px}
  .stat b{font-size:16px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<aside id="panel" class="glass" aria-label="Rota paneli">
  <button class="grab" id="grab" aria-label="Paneli büyüt veya küçült"></button>
  <header class="head" id="head">
    <div class="toprow">
      <span class="wordmark">ROTAM</span>
      <span class="pill-sel"><select id="tripSel" aria-label="Gezilerim"></select></span>
      <button class="icb" id="newTrip" title="Yeni gezi" aria-label="Yeni gezi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icb danger" id="delTrip" title="Geziyi sil" aria-label="Geziyi sil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5"/></svg></button>
    </div>
    <input id="tripTitle" aria-label="Gezi adı" placeholder="Gezine ad ver" enterkeyhint="done">
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="stWalk">0</b><span>km yürüyüş</span></div>
      <div class="stat"><b id="stSteps">0</b><span>adım</span></div>
      <div class="stat"><b id="stTotal">0</b><span>km toplam</span></div>
      <div class="stat"><b id="stStops">0</b><span>durak</span></div>
    </div>
  </header>
  <div class="find">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Durak ekle: yer, adres, kafe" autocomplete="off" enterkeyhint="search" aria-label="Durak ara">
      <div id="results" class="glass" hidden></div>
    </div>
    <p class="hint">Sırayı değiştirmek için durağı <b>⋮⋮</b> simgesinden tutup sürükle. Yolu değiştirmek için <b>Yol</b>'a bas.</p>
  </div>
  <div id="list"></div>
  <div class="foot">
    <button class="chip" id="clickAdd" aria-pressed="false">Haritadan ekle</button>
    <button class="chip" id="exportBtn">Dışa aktar</button>
    <label class="chip" for="importFile">İçe aktar<input id="importFile" type="file" accept=".json,application/json" hidden></label>
    <button class="chip" id="sampleBtn">Venedik örneği</button>
    <button class="chip" id="themeBtn">Tema</button>
  </div>
</aside>

<main id="stage">
  <div id="frame">
    <div id="map" data-look="sade" aria-label="Rota haritası"></div>
    <div class="caption glass" id="caption" hidden><div class="k"><i></i><span id="capK"></span></div><div class="v" id="capV"></div><div class="s" id="capS"></div></div>
    <div class="banner" id="banner" hidden></div>
    <div class="mediastage" id="mediastage" aria-live="polite"><div class="scrim"></div><div class="mcard" id="mcard"><div class="mbox" id="mbox"></div><div class="mcap"><span class="n" id="mN"></span><span class="t" id="mT"></span><span class="c" id="mC"></span></div></div></div>
    <div class="titlecard"><div class="glass" id="titleCard"></div></div>
    <div class="recdot" aria-hidden="true"></div>
    <div class="player glass" id="player">
      <button class="play" id="playBtn" aria-label="Animasyonu oynat"></button>
      <div class="track"><div class="lbl" id="trackLbl">Oynatmaya hazır</div><div class="bar"><i id="progBar"></i></div></div>
      <button class="pl" id="mediaBtn" aria-pressed="true" title="Duraklarda medyayı göster">
        <svg class="on-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 15.5l4.5-4 4 3.5 3-2.5 5.5 4.5"/><circle cx="15.5" cy="9.5" r="1.4"/></svg>
        <svg class="off-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3" opacity=".5"/><path d="M4 4l16 16"/></svg>
        <span class="t" id="mediaLbl">Medya açık</span></button>
      <details class="settings" id="settings">
        <summary class="pl" aria-label="Ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="t">Ayarlar</span></summary>
        <div class="popover glass">
          <h4>Animasyon</h4>
          <label>Hareket süresi <span class="v" id="durV">30 sn</span><input type="range" id="dur" min="10" max="120" value="30"></label>
          <label>Fotoğraf başına <select id="photoSec"><option value="2">2 sn</option><option value="3" selected>3 sn</option><option value="4">4 sn</option><option value="6">6 sn</option></select></label>
          <label>Video en fazla <select id="vidMax"><option value="8">8 sn</option><option value="15" selected>15 sn</option><option value="30">30 sn</option><option value="999">Sonuna kadar</option></select></label>
          <label>Video sesi <input type="checkbox" id="vidSound" checked></label>
          <label>Kamera takip etsin <input type="checkbox" id="follow" checked></label>
          <label>Sunum kadrajı <select id="ratio"><option value="r916" selected>9:16 Reels</option><option value="r45">4:5 Gönderi</option><option value="r169">16:9 YouTube</option><option value="full">Tam ekran</option></select></label>
        </div>
      </details>
      <button class="pl" id="presentBtn" title="Sunum modu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/></svg><span class="t">Sunum</span></button>
      <button class="pl rec" id="recBtn" title="Videoyu kaydet"><span class="dotrec"></span><span class="t">Kaydet</span></button>
    </div>
    <button class="chip glass exit-present" id="exitPresent">Çık</button>
    <div class="toast glass" id="toast" hidden></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid = 0;
const newId = p => p + Date.now().toString(36) + (++uid).toString(36);
const fmtKm = m => (m/1000).toFixed(m < 10000 ? 2 : m < 100000 ? 1 : 0);
const fmtMin = n => n < 60 ? `${Math.max(1, Math.round(n))} dk` : `${Math.floor(n/60)} sa ${Math.round(n%60)} dk`;
const pad2 = n => String(n).padStart(2, '0');
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Her durak kendi çıkış yolculuğunu taşır (stop.out: nasıl ayrıldın). Sıra değişse, durak gizlense ya da silinse
   ulaşım şekli durağın yanında kalır. t.segs bu nesnelere işaret eden türetilmiş bir dizidir. */
function normalize(t = S){
  t.stops = t.stops || [];
  const legacy = Array.isArray(t.segs) ? t.segs : [];
  const n = t.stops.length;
  t.stops.forEach((s, i) => {
    if (!s.id) s.id = newId('s'); s.media = s.media || []; s.hidden = !!s.hidden;
    if (!s.out || typeof s.out !== 'object'){
      const L0 = legacy[i];
      if (L0 && typeof L0 === 'object' && i < n - 1){
        s.out = {mode:L0.mode, vias:L0.vias || [], free:!!L0.free, to:t.stops[i+1].id};
        if (L0.geom){ s.out.geom = L0.geom; s.out.dist = L0.dist; s.out.min = L0.min; }
      } else {
        const prev = i > 0 && t.stops[i-1].out;
        s.out = {mode:prev ? prev.mode : 'walk', vias:[], free:false};
      }
    }
    const o = s.out;
    if (o.mode === 'people') o.mode = 'cable';
    if (!MODES[o.mode]) o.mode = 'walk';
    o.vias = Array.isArray(o.vias) ? o.vias : [];
    const nid = i < n - 1 ? t.stops[i+1].id : null;
    if (o.to !== nid){
      if (o.to !== undefined) o.vias = [];   /* bağlandığı durak değişti: eski ara noktalar artık geçersiz */
      o.geom = null; o.dist = null; o.min = null; o.warn = '';
      o.to = nid;
    }
  });
  t.segs = t.stops.slice(0, Math.max(0, n - 1)).map(s => s.out);
}

const IDB = {
  db:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let rq; try { rq = indexedDB.open('rotam-media', 1); } catch(e){ rej(e); return; }
      rq.onupgradeneeded = () => rq.result.createObjectStore('files');
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', mode), r = fn(t.objectStore('files'));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  },
  put(id, blob){ return this.tx('readwrite', st => st.put(blob, id)); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)).catch(() => {}); }
};
const urlCache = new Map();

  try { const b = await IDB.get(id); if (!b) return null; const u = URL.createObjectURL(b); urlCache.set(id, u); return u; }
  catch(e){ return null; }
}
function dropMedia(list){ (list || []).forEach(m => { IDB.del(m.id); const u = urlCache.get(m.id); if (u){ URL.revokeObjectURL(u); urlCache.delete(m.id); } }); }

/* ---------- Geometri ---------- */
const R = 6371000, rad = d => d * Math.PI / 180;
function hav(a, b){
  const dLat = rad(b[0]-a[0]), dLng = rad(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(Math.min(1, h)));
}
const pathLen = pts => pts.reduce((s, p, i) => i ? s + hav(pts[i-1], p) : 0, 0);
function smooth(pts){
  if (pts.length < 3) return pts;
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    for (let t = 0; t < 1; t += 0.125){
      const t2 = t*t, t3 = t2*t;
      out.push([0,1].map(k => 0.5*((2*p1[k]) + (-p0[k]+p2[k])*t + (2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2 + (-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)));
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function arc(pts){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const [la1, lo1] = pts[i].map(rad), [la2, lo2] = pts[i+1].map(rad);
    const d = hav(pts[i], pts[i+1]) / R;
    if (d < 1e-6){ out.push(pts[i]); continue; }
    const n = Math.max(8, Math.min(128, Math.round(d * 200)));
    for (let k = 0; k < n; k++){
      const f = k / n, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
      const x = A*Math.cos(la1)*Math.cos(lo1) + B*Math.cos(la2)*Math.cos(lo2);
      const y = A*Math.cos(la1)*Math.sin(lo1) + B*Math.cos(la2)*Math.sin(lo2);
      const z = A*Math.sin(la1) + B*Math.sin(la2);
      let lng = Math.atan2(y, x) * 180 / Math.PI;
      const prev = out[out.length-1];
      if (prev){ while (lng - prev[1] > 180) lng -= 360; while (lng - prev[1] < -180) lng += 360; }
      out.push([Math.atan2(z, Math.hypot(x, y)) * 180 / Math.PI, lng]);
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
const segPts = i => [[S.stops[i].lat, S.stops[i].lng], ...S.segs[i].vias, [S.stops[i+1].lat, S.stops[i+1].lng]];

/* Gizli adımlar: numara almaz, videoda görünmez. Görünür rota ilk görünür duraktan son görünür durağa kadar;
   aradaki gizli duraklar rotada "geçiş noktası" olarak kalır. */
function visRange(){ let f = -1, l = -1; S.stops.forEach((s, i) => { if (!s.hidden){ if (f < 0) f = i; l = i; } }); return [f, l]; }
function visNums(){ let n = 0; return S.stops.map(s => s.hidden ? null : ++n); }
const segGhost = i => { const [f, l] = visRange(); return f < 0 || i < f || i >= l; };
const nextVis = i => { for (let k = i + 1; k < S.stops.length; k++) if (!S.stops[k].hidden) return k; return -1; };
const prevVis = i => { for (let k = i; k >= 0; k--) if (!S.stops[k].hidden) return k; return -1; };
const visBounds = () => { const [f, l] = visRange(); const pts = [];
  if (f >= 0) for (let i = f; i < l; i++) pts.push(...(S.segs[i].geom || segPts(i)));
  if (!pts.length && f >= 0) pts.push([S.stops[f].lat, S.stops[f].lng]);
  return L.latLngBounds(pts); };
/* Ardışık gizli adımlar bir grup oluşturur. lead: baştaki, trail: sondaki, mid: iki görünür durak arası (rota buradan geçer). */
const openGhosts = new Set();
function ghostState(){
  const n = S.stops.length, groups = [], stopG = new Map(), segG = new Map();
  for (let i = 0; i < n; i++){
    if (!S.stops[i].hidden) continue;
    let j = i; while (j + 1 < n && S.stops[j+1].hidden) j++;
    const before = i - 1, after = j + 1 < n ? j + 1 : -1;
    const type = before < 0 ? 'lead' : after < 0 ? 'trail' : 'mid';
    const segs = [];
    for (let k = i; k <= j; k++) if (k < S.segs.length) segs.push(k);
    const g = {h0:i, h1:j, type, segs, key:S.stops[i].id, open:openGhosts.has(S.stops[i].id)};
    groups.push(g);
    for (let k = i; k <= j; k++) stopG.set(k, g);
    segs.forEach(k => segG.set(k, g));
    i = j;
  }
  return {groups, stopG, segG};
}
/* Haritada/panelde görünsün mü: gizli adımlar sadece grubu açıkken görünür, sunumda hiç görünmez */
function ghostShownStop(i, gs){ if (!S.stops[i].hidden) return true; if (presenting()) return false; const g = (gs || ghostState()).stopG.get(i); return !!(g && g.open); }
function ghostShownSeg(i, gs){
  if (!segGhost(i)) return true; if (presenting()) return false;
  const G = gs || ghostState(), a = G.stopG.get(i), b = G.stopG.get(i + 1);
  return !!((a && a.open) || (b && b.open));
}

/* ---------- Yol bulma (OpenStreetMap) ---------- */
const routeCache = new Map();
async function routeVia(profile, pts){
  const key = profile + '|' + pts.map(p => p[0].toFixed(5)+','+p[1].toFixed(5)).join(';');
  if (routeCache.has(key)) return routeCache.get(key);
  const coords = pts.map(p => p[1].toFixed(6)+','+p[0].toFixed(6)).join(';');
  const urls = [`https://routing.openstreetmap.de/routed-${profile}/route/v1/${profile === 'car' ? 'driving' : profile}/${coords}?overview=full&geometries=geojson`];
  if (profile === 'car') urls.push(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
  for (const u of urls){
    try {
      const r = await fetch(u); if (!r.ok) continue;
      const j = await r.json();
      if (j.code !== 'Ok' || !j.routes || !j.routes[0]) continue;
      const res = {geom:j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), dist:j.routes[0].distance};
      routeCache.set(key, res); return res;
    } catch(e){}
  }
  return null;
}
let computeToken = 0;
async function computeSeg(i){
  const seg = S.segs[i]; if (!seg) return;
  const pts = segPts(i), m = MODES[seg.mode];
  seg.warn = '';
  if (m.route && !seg.free){
    seg.loading = true; renderList();
    const r = await routeVia(m.route, pts);
    seg.loading = false;
    if (r){ seg.geom = r.geom; seg.dist = r.dist; }
    else { seg.geom = pts; seg.dist = pathLen(pts); seg.warn = 'Yol bulunamadı, düz çizgi gösteriliyor. İnternetini kontrol et ya da ara nokta ekle.'; }
  } else {
    seg.geom = m.air ? arc(pts) : m.water ? smooth(pts) : pts;
    seg.dist = pathLen(seg.geom);
  }
  seg.min = seg.dist / 1000 / m.kmh * 60;
}
async function computeAll(force){
  const tok = ++computeToken, trip = S;
  for (let i = 0; i < trip.segs.length; i++){
    if (tok !== computeToken || trip !== S) return;
    if (force || !trip.segs[i].geom) await computeSeg(i);
  }
  renderAll(); save();
}
async function recompute(idxs){
  for (const i of idxs) if (i >= 0 && i < S.segs.length) await computeSeg(i);
  renderAll(); save();
}

function drawLines(){
  lineLayer.clearLayers();
  const halo = getComputedStyle(document.documentElement).getPropertyValue('--halo').trim() || '#fff';
  const gs = ghostState();
  S.segs.forEach((seg, i) => {
    if (!seg.geom) return;
    const ghost = segGhost(i);
    if (!ghostShownSeg(i, gs)) return;
    const m = MODES[seg.mode], act = i === activeSeg, w = m.air ? 3 : 4.5;
    const op = ghost ? (act ? .7 : .3) : (activeSeg < 0 || act ? 1 : .35);
    L.polyline(seg.geom, {color:halo, weight:w + 5, opacity:ghost ? .5 : 1, interactive:false, lineCap:'round', lineJoin:'round', ghost}).addTo(lineLayer);
    L.polyline(seg.geom, {color:mcol(m), weight:act ? w + 2 : w, opacity:op, dashArray:ghost && !m.dashed ? '2 7' : dashFor(m), lineCap:'round', lineJoin:'round', interactive:false, ghost}).addTo(lineLayer);
    L.polyline(seg.geom, {color:'#000', weight:22, opacity:0, lineCap:'round'}).addTo(lineLayer)
      .on('click', ev => {
        L.DomEvent.stopPropagation(ev);
        const p = [ev.latlng.lat, ev.latlng.lng];
        if (clickAdd) addStop({name:`Durak ${S.stops.length + 1}`, lat:p[0], lng:p[1], note:''});
        else if (activeSeg === i) addVia(i, p); else setActive(i);
      })
      .bindTooltip(`${esc(S.stops[i].name)} → ${esc(S.stops[i+1].name)} · ${m.ad}${ghost ? ' (gizli)' : ''}`, {sticky:true, className:'linelabel'});
  });
}
const pinIcon = (n, cls) => L.divIcon({className:'', html:`<div class="pin ${cls||''}">${pad2(n)}</div>`, iconSize:[24,24], iconAnchor:[12,12]});
function drawPins(){
  pinLayer.clearLayers();

async function search(q){

  try {
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&zoom=${z}&location_bias_scale=0.3&limit=8`, {signal:qCtl.signal});
    if (!r.ok) throw new Error('photon');

    res = (j.features || []).map(f => { const p = f.properties;
      return {name:p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || q, lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0],

function buildTimeline(){

    const cum = [0]; for (let k = 1; k < g.length; k++) cum.push(cum[k-1] + hav(g[k-1], g[k]));

  segs.forEach((s, k) => { s.t0 = t; s.pauseEnd = t + (s.vis ? pause : 0); s.t1 = s.pauseEnd + moveTotal * w[k] / sumW; t = s.t1; });

  const a = anim; a.holding = true; a.shown.add(stopIdx);
  const el = moverEl(); if (el) el.classList.add('idle');
  const hs = performance.now(), st = S.stops[stopIdx];
  playMedia(stopIdx, {collapseTo:[st.lat, st.lng]}).then(done => {
    if (anim !== a) return;
    if (done) addBubble(animLayer, stopIdx, '', false);
    a.start += performance.now() - hs; a.holding = false;
    if (!a.paused) requestAnimationFrame(tick);
  });
}
const wantsMedia = i => mediaOn && S.stops[i] && !S.stops[i].hidden && S.stops[i].media.length && !anim.shown.has(i);

/* Araç yönü ve efektler */
function orient(pos, s, frac){
  const a = anim, el = moverEl(); if (!el) return;
  const lp = map.latLngToLayerPoint(pos);
  const m = MODES[s.mode];
  if (a.prevLP){
    const dx = lp.x - a.prevLP.x, dy = lp.y - a.prevLP.y;
    if (m.icon === 'plane'){
      if (Math.hypot(dx, dy) > .3){
        const target = Math.atan2(dx, -dy) * 180 / Math.PI;
        let diff = ((target - a.heading + 540) % 360) - 180;
        a.heading += diff * .2;
      }
      if (a.orEl) a.orEl.style.transform = `rotate(${a.heading.toFixed(1)}deg)`;
      el.style.setProperty('--alt', Math.sin(Math.PI * frac).toFixed(3));
    } else if (Math.abs(dx) > .7){
      const mir = dx < 0;
      if (mir !== a.mirror){ a.mirror = mir; if (a.orEl) a.orEl.style.transform = mir ? 'scaleX(-1)' : ''; }
    }
  }
  a.prevLP = lp;
}
function footprints(s, d){
  const a = anim, lat = s.g[0][0];
  const spacing = 11 * 156543.03392 * Math.cos(rad(lat)) / 2 ** map.getZoom();
  if (!a.foot || a.foot.seg !== s.i) a.foot = {seg:s.i, next:spacing, side:1};
  const color = mcol(MODES.walk);
  let guard = 0;
  while (a.foot.next <= d && guard++ < 40){
    const r = pointAtDist(s, a.foot.next);
    const A = map.latLngToLayerPoint(s.g[r.k-1]), B = map.latLngToLayerPoint(s.g[r.k]);
    const len = Math.hypot(B.x - A.x, B.y - A.y) || 1;
    const P = map.latLngToLayerPoint(r.p);
    const off = 2.6 * a.foot.side;
    const q = L.point(P.x - (B.y - A.y) / len * off, P.y + (B.x - A.x) / len * off);
    L.circleMarker(map.layerPointToLatLng(q), {renderer:footRenderer, radius:1.7, stroke:false, fillColor:color, fillOpacity:.9, interactive:false}).addTo(animLayer);
    a.foot.next += spacing; a.foot.side *= -1;
  }
}
function tick(now){
  const a = anim; if (!a || a.paused || a.holding) return;
  const t = now - a.start; a.elapsed = t;
  $('progBar').style.width = Math.min(100, t / a.tl.end * 100) + '%';
  let pos = null, waiting = false;
  const nums = a.nums || (a.nums = visNums());
  for (const s of a.tl.segs){
    if (t < s.t0) break;
    if (t >= s.t1){ s.trail.setLatLngs(s.g); revealStop(s.i); continue; }
    revealStop(s.i);
    const m = MODES[s.mode];
    if (a.lastSeg !== s.i){
      a.lastSeg = s.i; a.camZoom = s.zoom; a.prevLP = null;
      if ($('follow').checked && s.k > 0 && (s.zoom !== a.tl.segs[s.k-1].zoom || !s.zoom)) camFor(s);
      if (s.vis){
        const st = S.stops[s.i], nv = nextVis(s.i);
        caption(`Durak ${pad2(nums[s.i])}`, st.name, st.note || `Sırada ${m.ad.toLowerCase()} ile ${nv >= 0 ? S.stops[nv].name : S.stops[s.i+1].name}`);
        $('trackLbl').textContent = `${pad2(nums[s.i])} · ${st.name}`;
      }
      a.mover.setLatLng(s.g[0]);
      if (wantsMedia(s.i)){ hold(s.i); return; }
    }
    if (t < s.pauseEnd){ pos = s.g[0]; waiting = true; }
    else {
      if (a.curMode !== s.mode){ a.curMode = s.mode; a.mover.setIcon(moverIcon(s.mode)); a.mvEl = null; a.mirror = false; a.heading = 0; }
      if (a.capSeg !== s.i){
        a.capSeg = s.i;
        const from = S.stops[Math.max(0, prevVis(s.i))], nv = nextVis(s.i), to = S.stops[nv >= 0 ? nv : s.i + 1];
        caption(m.ad, `${from.name} → ${to.name}`, `${fmtKm(s.len)} km · yaklaşık ${fmtMin(s.len / 1000 / m.kmh * 60)}`, mcol(m));
      }
      const frac = ease((t - s.pauseEnd) / (s.t1 - s.pauseEnd)), d = s.len * frac;
      const r = pointAtDist(s, d);
      s.trail.setLatLngs([...s.g.slice(0, r.k), r.p]);
      pos = r.p;
      orient(pos, s, frac);
      if (m.icon === 'walk') footprints(s, d);
      if (m.water && now - a.lastFx > (m.icon === 'gondola' ? 420 : 260)){ a.lastFx = now; fx('ripple', pos, mcol(m), 1700); }
    }
  }
  const lastSeg = a.tl.segs[a.tl.segs.length - 1];
  if (t >= lastSeg.t1){
    const li = a.tl.vl; revealStop(li);
    pos = [S.stops[li].lat, S.stops[li].lng]; waiting = true;
    if (a.capSeg !== 'end'){
      a.capSeg = 'end';
      caption('Son durak', S.stops[li].name, `${$('stTotal').textContent} km yol · ${$('stWalk').textContent} km yürüyüş · ${$('stSteps').textContent} adım`);
      $('trackLbl').textContent = `${pad2(nums[li])} · ${S.stops[li].name}`;
      a.mover.setLatLng(pos);
      if (wantsMedia(li)){ hold(li); return; }
    }
  }
  const el = moverEl(); if (el) el.classList.toggle('idle', waiting);
  if (pos){ a.mover.setLatLng(pos); if ($('follow').checked && a.camZoom) centerOn(pos, map.getZoom()); }
  if (t >= a.tl.end){
    map.flyToBounds(L.latLngBounds(a.tl.segs.flatMap(s => s.g)), {...fitPad(), duration:1.4, maxZoom:16});
    finish(); return;
  }
  requestAnimationFrame(tick);
}
function finish(){
  anim.done = true; document.body.classList.remove('playing');
  const el = moverEl(); if (el) el.classList.add('idle');
  $('playBtn').innerHTML = REPLAY; $('playBtn').setAttribute('aria-label', 'Tekrar oynat'); $('progBar').style.width = '100%';
  if (rec) setTimeout(endRecording, 2000);
}
function stopAnim(silent){
  cancelMedia();
  animLayer.clearLayers(); anim = null; $('caption').hidden = true; $('progBar').style.width = '0'; $('trackLbl').textContent = 'Oynatmaya hazır';
  document.body.classList.remove('playing'); $('playBtn').innerHTML = PLAY; $('playBtn').setAttribute('aria-label', 'Animasyonu oynat');
  if (!silent) renderAll(); else { drawLines(); drawPins(); drawBubbles(); }
}
$('playBtn').onclick = () => {
  if (anim && !anim.done){
    if (anim.holding) return;
    const el = moverEl();
    if (!anim.paused){ anim.paused = true; if (el) el.classList.add('idle'); document.body.classList.remove('playing'); $('playBtn').innerHTML = PLAY; $('playBtn').setAttribute('aria-label', 'Devam et'); return; }
    anim.paused = false; anim.start = performance.now() - anim.elapsed; document.body.classList.add('playing'); $('playBtn').innerHTML = PAUSE; $('playBtn').setAttribute('aria-label', 'Duraklat'); requestAnimationFrame(tick); return;
  }
  play();
};

/* ---------- Medya oynatma ---------- */
let mediaCancel = null;
function cancelMedia(){ if (mediaCancel) mediaCancel(); }
let previewing = false;
async function previewMedia(i){
  if (anim || previewing) return;
  previewing = true;
  const stage = $('mediastage');
  stage.classList.add('interactive');
  const skip = () => { if (skipFn) skipFn(); };
  stage.addEventListener('click', skip);
  await playMedia(i, {preview:true});
  stage.removeEventListener('click', skip);
  stage.classList.remove('interactive');
  previewing = false;
}
let skipFn = null;
async function playMedia(stopIdx, opts = {}){
  const st = S.stops[stopIdx], items = st.media.slice();
  let cancelled = false, wake = null;
  mediaCancel = () => { cancelled = true; if (wake) wake(); };
  skipFn = () => { if (wake) wake(); };
  const sleep = ms => new Promise(r => { wake = r; setTimeout(r, ms); });
  const stage = $('mediastage'), box = $('mbox'), card = $('mcard');
  const n = visNums()[stopIdx];
  $('mN').textContent = n ? pad2(n) : '··'; $('mT').textContent = st.name;
  const photoMs = +$('photoSec').value * 1000, vidMax = +$('vidMax').value * 1000;
  for (let k = 0; k < items.length && !cancelled; k++){
    const it = items[k], u = await mediaURL(it.id);
    if (!u) continue;
    $('mC').textContent = (items.length > 1 ? `${k+1} / ${items.length}` : '') + (opts.preview ? (items.length > 1 ? ' · dokun: sonraki' : ' · dokun: kapat') : '');
    box.innerHTML = '';
    if (it.type === 'video'){
      const v = Object.assign(document.createElement('video'), {src:u, playsInline:true, muted:!$('vidSound').checked, autoplay:true});
      v.setAttribute('playsinline', '');
      box.appendChild(v); stage.classList.add('on');
      await new Promise(res => {
        let done = false; const end = () => { if (!done){ done = true; res(); } };
        wake = end; v.onended = end; v.onerror = end;
        setTimeout(end, vidMax);
        v.play().catch(() => { v.muted = true; v.play().catch(end); });
      });
      v.pause();
    } else {
      const img = new Image(); img.src = u; img.alt = st.name;
      try { await img.decode(); } catch(e){}
      box.appendChild(img); stage.classList.add('on');
      await sleep(photoMs);
    }
    if (k < items.length - 1 && !cancelled){ stage.classList.remove('on'); await sleep(300); }
  }
  const done = !cancelled;
  if (done && opts.collapseTo && stage.classList.contains('on') && !RM()){
    /* Kart, durağın yanındaki baloncuğa doğru küçülür */
    const fr = $('frame').getBoundingClientRect(), cr = card.getBoundingClientRect();
    const tp = map.latLngToContainerPoint(opts.collapseTo);
    const dx = tp.x + BUB_OFF[0] - (cr.left - fr.left + cr.width / 2), dy = tp.y + BUB_OFF[1] - (cr.top - fr.top + cr.height / 2);
    const sc = Math.max(.04, 46 / Math.max(cr.width, cr.height));
    stage.classList.add('collapsing');
    card.style.transition = 'transform .62s cubic-bezier(.65,0,.25,1), opacity .2s linear .45s, border-radius .62s';
    card.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sc.toFixed(3)})`;
    card.style.opacity = '0';
    await sleep(640);
  }
  stage.classList.remove('on', 'collapsing');
  await sleep(cancelled ? 0 : (opts.collapseTo ? 80 : 420));
  card.style.transition = 'none'; card.style.transform = ''; card.style.opacity = '';
  void card.offsetWidth; card.style.transition = '';
  box.innerHTML = ''; mediaCancel = null; skipFn = null;
  return done;
}

/* ---------- Sunum ---------- */
const presenting = () => document.body.classList.contains('present');
function present(on){
  document.body.classList.toggle('present', on);
  $('frame').className = on && $('ratio').value !== 'full' ? $('ratio').value : '';
  $('settings').open = false;
  if (!anim) { drawLines(); drawPins(); drawBubbles(); drawLegend(); }
  return new Promise(r => setTimeout(() => {
    map.invalidateSize({pan:false});
    if (S.segs.length) fitTo(on ? visBounds() : L.latLngBounds(S.segs.flatMap((s, i) => s.geom || segPts(i))), {animate:false});
    r();
  }, 90));
}
$('presentBtn').onclick = () => present(!presenting());
$('exitPresent').onclick = () => { if (rec) cancelRecording(); present(false); };
$('ratio').onchange = () => { if (presenting()) present(true); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (rec) cancelRecording(); else if (presenting()) present(false); $('settings').open = false; }
  if (e.key === ' ' && presenting() && !rec){ e.preventDefault(); $('playBtn').click(); }
});

/* ---------- Video kaydı (sekme yakalama) ---------- */
let rec = null;
async function startRecording(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder){
    toast(isMobile() ? 'Telefonda sayfa içinden kayıt yapılamıyor. Sunum moduna geçip telefonun ekran kaydını kullan.' : 'Bu tarayıcı kayıt yapamıyor. Chrome veya Edge kullan ya da ekran kaydı al.');
    if (isMobile()) present(true);
    return;
  }
  if (S.stops.length < 2){ toast('Kayıt için en az iki durak gerekli'); return; }
  stopAnim(true);
  await present(true);
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30}, audio:true, preferCurrentTab:true, selfBrowserSurface:'include', surfaceSwitching:'exclude'});
  } catch(e){ toast('Kayıt başlamadı. Açılan pencerede bu sekmeyi seçip Paylaş\'a bas.'); return; }
  const track = stream.getVideoTracks()[0];
  if (window.CropTarget && track.cropTo){ try { await track.cropTo(await CropTarget.fromElement($('frame'))); } catch(e){} }
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mimeType = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  const mr = new MediaRecorder(stream, mimeType ? {mimeType, videoBitsPerSecond:10e6} : undefined);
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec = {stream, mr, cancelled:false};
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    document.body.classList.remove('recording');
    const r = rec; rec = null;
    if (!r || r.cancelled || !chunks.length) return;
    const ext = (mimeType || 'video/webm').includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, {type:mimeType || 'video/webm'}));
    a.download = `${slug(S.title)}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    toast(`Video indirildi (.${ext})`);
  };
  track.addEventListener('ended', () => { if (rec) cancelRecording(); });
  document.body.classList.add('recording');
  await wait(700);
  mr.start(500);
  await wait(500);
  if (!play()) cancelRecording();
}
function endRecording(){ if (rec && rec.mr.state !== 'inactive') rec.mr.stop(); }
function cancelRecording(){ if (!rec) return; rec.cancelled = true; endRecording(); stopAnim(true); toast('Kayıt iptal edildi'); }
$('recBtn').onclick = () => rec ? cancelRecording() : startRecording();

/* ---------- Geziler, dışa/içe aktarma, tema ---------- */
function openTrip(t){
  stopAnim(true); S = t; normalize(); activeSeg = -1; setClickAdd(false); banner('');
  $('tripTitle').value = S.title || ''; openStops.clear(); openGhosts.clear(); renderTrips(); renderAll(); fitAll(); computeAll(false); save();
}
$('tripTitle').value = S.title || '';
$('tripTitle').oninput = e => { S.title = e.target.value; renderStats(); renderTrips(); save(); };
$('tripTitle').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
$('tripSel').onchange = e => { const t = DB.trips.find(x => x.id === e.target.value); if (t) openTrip(t); };
$('newTrip').onclick = () => {
  const t = {v:4, id:newId('t'), title:'', stops:[], segs:[]};
  DB.trips.unshift(t); openTrip(t); if (isMobile()) setSheet('half'); $('tripTitle').focus();
  toast('Yeni gezi açıldı. Önce bir ad ver, sonra durak ekle.');
};
$('delTrip').onclick = () => {
  const b = $('delTrip'); if (DB.trips.length < 2) return;
  if (!b.classList.contains('armed')){ b.classList.add('armed'); toast('Geziyi silmek için tekrar bas'); setTimeout(() => b.classList.remove('armed'), 3000); return; }
  b.classList.remove('armed');
  const name = S.title || 'Adsız gezi';
  S.stops.forEach(s => dropMedia(s.media));
  DB.trips = DB.trips.filter(t => t.id !== S.id); openTrip(DB.trips[0]); toast(`“${name}” silindi`);
};
$('exportBtn').onclick = () => {
  const data = JSON.stringify({v:5, title:S.title,
    stops:S.stops.map(({id, name, lat, lng, note, hidden, out}) => ({id, name, lat, lng, note, hidden:!!hidden, out:{mode:out.mode, vias:out.vias, free:!!out.free}})),
    segs:S.segs.map(({mode, vias, free}) => ({mode, vias, free}))}, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = slug(S.title) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast(S.stops.some(s => s.media.length) ? 'Rota indirildi. Foto ve videolar dosyaya dahil değil.' : 'Rota dosyası indirildi');
};
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.stops) || !Array.isArray(j.segs)) throw 0;
    j.id = newId('t'); j.stops.forEach(s => { s.id = newId('s'); s.media = []; if (s.out) delete s.out.to; });
    DB.trips.unshift(j); openTrip(j); toast('Rota yeni gezi olarak eklendi');
  } catch(err){ toast('Bu dosya okunamadı. Rotam\'dan dışa aktarılmış bir .json seç.'); }
  e.target.value = '';
};
$('sampleBtn').onclick = () => { const t = sampleTrip(); DB.trips.unshift(t); openTrip(t); toast('Venedik örneği yeni gezi olarak eklendi'); };
$('themeBtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('rotam-theme', next); } catch(e){}
  renderAll();
};
try { const th = localStorage.getItem('rotam-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}

let toastT;
function toast(msg, action){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  if (action){ const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.hidden = true; action.fn(); }; t.appendChild(b); }
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, action ? 5000 : 3000);
}
function fitAll(){
  if (!S.stops.length) return;
  const gs = ghostState(), pts = S.stops.filter((s, i) => ghostShownStop(i, gs)).map(s => [s.lat, s.lng]);
  fitTo(L.latLngBounds(pts.length ? pts : S.stops.map(s => [s.lat, s.lng])), {maxZoom:16, animate:false});
}

/* ---------- Telefon: sürüklenebilir alt panel ---------- */
let sheet = 'half';
const probe = Object.assign(document.createElement('div'), {style:'position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)'});
document.body.appendChild(probe);
const safeTop = () => parseFloat(getComputedStyle(probe).paddingTop) || 0;
const safeBottom = () => parseFloat(getComputedStyle(probe).paddingBottom) || 0;
const viewH = () => (window.visualViewport ? visualViewport.height : innerHeight);
const SHEETS = {
  peek:() => Math.round($('head').offsetHeight + 2),
  half:() => Math.round(viewH() * .5),
  full:() => Math.round(viewH() - safeTop() - safeBottom() - 28)
};
const sheetPx = () => isMobile() ? SHEETS[sheet]() : 0;
function setSheet(s){ sheet = s; applySheet(); }
function applySheet(px){
  const h = isMobile() ? (px ?? SHEETS[sheet]()) : 0;
  document.documentElement.style.setProperty('--sheet-h', h + 'px');
  document.body.classList.toggle('sheet-full', isMobile() && sheet === 'full' && px == null);
  $('grab').setAttribute('aria-label', sheet === 'full' ? 'Paneli küçült' : 'Paneli büyüt');
}
(() => {
  const panel = $('panel'); let y0 = 0, h0 = 0, moved = false, dragging = false, lastY = 0, lastT = 0, vel = 0;
  const down = e => {
    if (!isMobile() || e.target.closest('input,select,button:not(.grab),label,a')) return;
    dragging = true; moved = false; y0 = lastY = e.clientY; lastT = performance.now(); vel = 0; h0 = SHEETS[sheet](); panel.classList.add('dragging');
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}
  };
  const move = e => {
    if (!dragging) return;
    const dy = e.clientY - y0; if (Math.abs(dy) > 5) moved = true;
    const nt = performance.now(); vel = (e.clientY - lastY) / Math.max(1, nt - lastT); lastY = e.clientY; lastT = nt;
    applySheet(Math.max(SHEETS.peek() - 30, Math.min(SHEETS.full() + 20, h0 - dy)));
  };
  const up = e => {
    if (!dragging) return; dragging = false; panel.classList.remove('dragging');
    if (!moved){ setSheet(sheet === 'peek' ? 'half' : sheet === 'half' ? 'full' : 'peek'); return; }
    const order = ['peek', 'half', 'full'];
    if (Math.abs(vel) > .5){ const k = order.indexOf(sheet) + (vel < 0 ? 1 : -1); setSheet(order[Math.max(0, Math.min(2, k))]); return; }
    const h = h0 - (e.clientY - y0);
    setSheet(order.reduce((a, k) => Math.abs(SHEETS[k]() - h) < Math.abs(SHEETS[a]() - h) ? k : a, 'half'));
  };
  [$('grab'), $('head')].forEach(el => { el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); });
})();
let resizeT;
const onResize = () => { clearTimeout(resizeT); resizeT = setTimeout(() => { applySheet(); map.invalidateSize({pan:false}); }, 80); };
addEventListener('resize', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* ---------- Başlat ---------- */
applySheet(); renderTrips(); renderAll(); fitAll(); computeAll(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => applySheet());
})();
</script>
